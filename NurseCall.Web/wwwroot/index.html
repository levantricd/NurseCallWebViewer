<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nurse Call Web Viewer</title>
    <link rel="stylesheet" href="/css/site.css">
</head>

<body>

    <header class="topbar">
        <div>
            <h1>Nurse Call</h1>
            <div class="subtitle">Web Viewer</div>
        </div>

        <div class="system-status">
            <span class="status-dot"></span>
            <span>Đang kết nối</span>
        </div>
    </header>

    <main>

        <section id="active-calls" class="active-calls-section">
            <div class="active-calls-header">
                <div>
                    <h2>Cuộc gọi đang hoạt động</h2>
                    <div id="active-calls-summary">
                        Đang kiểm tra...
                    </div>
                </div>

                <div id="calls-status" class="calls-status">
                    Đang tải
                </div>
            </div>

            <div id="calls-list" class="calls-list">
                <div class="loading">
                    Đang tải cuộc gọi...
                </div>
            </div>
        </section>

        <section id="viewer">
            <div class="loading">
                Đang tải dữ liệu...
            </div>
        </section>

    </main>

    <script src="/js/site.js"></script>

</body>
</html>
